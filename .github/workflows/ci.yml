name: Flask CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Start containers
        env:
          NGINX_PORT: "8080"
          APP_ENV: ci
          APP_VERSION: "1.0.0"
        run: docker compose up -d --build

      - name: Check application
        run: |
          sleep 5
          bash check-app.sh
