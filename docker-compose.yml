services:
  flask-web:
    build: .
    container_name: flask-web
    environment:
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
    expose:
      - "5000"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask-web
